<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 | 自我介绍</title>
    <style>
        /* 全局基础重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 核心卡片容器 */
        .profile-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 900px;
            padding: 40px;
            display: flex;
            gap: 40px;
            align-items: center;
            transition: all 0.3s ease;
        }

        /* 头像样式 */
        .avatar-box {
            flex-shrink: 0;
            text-align: center;
        }

        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #4A90E2;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        /* 文本内容区 */
        .info-box {
            flex-grow: 1;
        }

        .name {
            font-size: 2rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 1.1rem;
            color: #4A90E2;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .bio {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #666;
            margin-bottom: 24px;
        }

        /* 标签列表 */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }

        .tag {
            background: #eef5ff;
            color: #4A90E2;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* 联系方式按钮 */
        .contact-btn {
            display: inline-block;
            background: #4A90E2;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .contact-btn:hover {
            background: #357ABD;
        }

        /* ==================== 响应式适配 (Media Queries) ==================== */

        /* 1. 平板电脑适配 (Tablet: 宽度 <= 768px) */
        @media (max-width: 768px) {
            .profile-card {
                flex-direction: column;
                text-align: center;
                padding: 30px;
                max-width: 500px;
            }

            .avatar {
                width: 130px;
                height: 130px;
            }

            .tags {
                justify-content: center;
            }
        }

        /* 2. 手机适配 (Mobile: 宽度 <= 480px) */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .profile-card {
                padding: 20px 16px;
                border-radius: 16px;
            }

            .avatar {
                width: 100px;
                height: 100px;
            }

            .name {
                font-size: 1.5rem;
            }

            .tagline {
                font-size: 0.95rem;
            }

            .bio {
                font-size: 0.85rem;
            }
        }

        /* 3. 智能手表适配 (Watch: 宽度 <= 240px) */
        @media (max-width: 240px) {
            body {
                padding: 0;
                background-color: #000; /* 手表上通常用纯黑背景省电 */
            }

            .profile-card {
                background: #000;
                color: #fff;
                box-shadow: none;
                padding: 8px;
                border-radius: 0;
                gap: 8px;
            }

            .avatar {
                width: 50px;
                height: 50px;
                border-width: 2px;
            }

            .name {
                font-size: 1rem;
                color: #fff;
                margin-bottom: 2px;
            }

            /* 手表屏幕极小，精简掉非核心元素 */
            .tagline, .bio, .tags {
                display: none;
            }

            .contact-btn {
                padding: 6px 10px;
                font-size: 0.7rem;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- 头像区域 -->
        <div class="avatar-box">
            <img src="https://via.placeholder.com/160" alt="个人头像" class="avatar">
        </div>

        <!-- 个人信息区域 -->
        <div class="info-box">
            <h1 class="name">你的名字</h1>
            <div class="tagline">全栈开发者 / 设计爱好者</div>
            
            <p class="bio">
                你好！我是一名热衷于创造优秀数字体验的开发者。喜欢将想法转化为优雅的代码与产品，探索新技术与设计美学的边界。
            </p>

            <!-- 个人标签 -->
            <div class="tags">
                <span class="tag">💡 创意设计</span>
                <span class="tag">💻 Web开发</span>
                <span class="tag">🚀 持续学习</span>
            </div>

            <!-- 联系按钮 -->
            <a href="mailto:yourname@example.com" class="contact-btn">联系我</a>
        </div>
    </div>

</body>
</html>
